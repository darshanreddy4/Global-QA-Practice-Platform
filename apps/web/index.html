<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Practice real-world QA automation on 130+ hands-on component and end-to-end challenges — dropdowns, tables, popups, dynamic DOM, API mocking, auth flows, and more." />
    <title>Global QA Practice Platform</title>
    <script>
      // Applied before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("qa-lab-theme");
          var theme = stored === "light" || stored === "gray" || stored === "dark"
            ? stored
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.classList.toggle("gray", theme === "gray");
          document.documentElement.style.colorScheme = theme === "light" ? "light" : "dark";
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
